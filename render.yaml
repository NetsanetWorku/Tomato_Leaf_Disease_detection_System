services:
  - type: web
    name: tomato-disease-detection
    env: python
    region: oregon
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: GDRIVE_MODEL_ID
        sync: false        # you will paste the value in Render dashboard
      - key: SECRET_KEY
        generateValue: true
